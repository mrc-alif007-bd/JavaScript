<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   
</head>
<body>
     <script>
        var sample2 = new Image ()
        sample2.src = "image/tiger.jpg"
        var sample1 = new Image ()
        sample1.src = "image/cat.jpg"
        function switch2 () {
            document.sample.src = sample2.src
        }
        function switch1 () {
            document.sample.src = sample1.src
        }
    </script>
    
    <a href="#" onMouseOver="switch2()" onMouseOut="switch1()">
        <img name="sample" src="image/cat.jpg" alt="sample">
    </a>
</body>
</html>
