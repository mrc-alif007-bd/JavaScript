<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <script>
        function emailvalidation(){
            let email = document.myform.email.value;
            let c_email = document.myform.c_email.value;
            let Pattern = /[A-z0-9]+@[A-z0-9]+\.[A-z]{2,4}$/;
            

           if( email.search(Pattern) == -1){
            alert("invalid email format")
           }
           else if(email!=c_email){
            alert(" email does not match")
           }
           else{
            alert("valid email format")
           }

        }
    </script>

<form name="myform">
    Email : <br>
    <input type="text" name="email" placeholder="Enter your email"> <br>
    Confrim Email : <br>
    <input type="text" name="c_email" placeholder="confrim email"> <br><br>

    <input type="button" value="submit" onclick="emailvalidation()" >
</form>



</body>
</html>
