<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <h3>Class Template</h3>

    <script>
        class CarClass {
            constructor(name,year){
                this.name = name ;
                this.year = year ;
            }
        }
        console.log(CarClass);
        const car1 = new CarClass("toyota","1990");
        const car2 = new CarClass("Mazda","1992");
        console.log(car1);
        console.log(car2);

        class student {
            constructor(name,address){
                this.name = name ;
                this.address = address ;
            }
        }
        const stud1 = new student ("tarek", "framget")
        console.log(stud1.name);
        
        
        
    </script>
</body>
</html>
