<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function fact(n){
            output = 1;

            for(i=1;i<=n;i++){
                output = output*i;
            }
            return output;
        }
        document.write(fact(prompt("enter your number")));
    </script>
</body>
</html>
