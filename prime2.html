<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function primen(x){
            if(x==1){
                return x + " is not a prime number"
            }
            if(x==2){
                return x + " is a prime number"
            }
            else{
                for(let y=2; y<x; y++){
                    if(x%y==0){
                        return x + " is not a prime number"
                    }
                    
                }
                return x + " is a prime number"
            }
            
        }
        document.write(primen(prompt("enter your number")))
    </script>
</body>
</html>
